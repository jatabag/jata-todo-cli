[package]
name = "jatabag"
version = "0.1.1"
edition = "2024"
description = "Command line client for Jatabag"
license = "MIT"
readme = "README.md"

[[bin]]
name = "jata"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
iana-time-zone = "0.1.65"
jiff = "0.2.35"
nucleo-picker = "0.12.1"
ureq = "3.4.0"
uuid = "1.26.0"

[profile.release]
strip = true
